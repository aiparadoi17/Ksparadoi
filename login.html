<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Sistem Absensi Sekolah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-slate-900 font-sans antialiased min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl p-8">
        <div class="text-center mb-8">
            <div class="inline-flex bg-indigo-600 text-white p-4 rounded-2xl shadow-lg mb-3">
                <i class="fa-solid fa-user-shield text-3xl"></i>
            </div>
            <h2 class="text-xl font-bold text-white tracking-tight">Login Administrator</h2>
            <p class="text-xs text-slate-400 mt-1">Kelola data siswa, jadwal, dan laporan absensi</p>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">Username</label>
                <input type="text" id="username" required placeholder="admin" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white focus:ring-2 focus:ring-indigo-500 font-mono">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">Password</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white focus:ring-2 focus:ring-indigo-500">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl text-sm transition shadow-lg">Masuk Dashboard</button>
        </form>

        <div class="mt-6 text-center">
            <a href="index.html" class="text-xs text-indigo-400 hover:underline">Kembali ke Halaman Utama</a>
        </div>
        <div class="mt-6 pt-4 border-t border-slate-700 text-center text-[11px] text-slate-500 font-mono">Default: admin / admin123</div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            if(u === 'admin' && p === 'admin123') {
                localStorage.setItem('is_admin', 'true');
                Swal.fire({ icon: 'success', title: 'Login Berhasil', timer: 1200, showConfirmButton: false }).then(() => { window.location.href = 'admin.html'; });
            } else {
                Swal.fire({ icon: 'error', title: 'Gagal', text: 'Username atau password salah!' });
            }
        }
    </script>
</body>
</html>
